version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: arxiv_user
      POSTGRES_PASSWORD: arxiv_pass
      POSTGRES_DB: arxiv_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - arxiv-net

  app:
    build: .
    container_name: arxiv-api
    restart: always
    depends_on:
      - postgres
    networks:
      - arxiv-net
    ports:
      - "8000:8000"

  nginx:
    build:
      context: .
      dockerfile: nginx.Dockerfile
    container_name: nginx-proxy
    restart: always
    depends_on:
      - app
    networks:
      - arxiv-net
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  postgres_data:

networks:
  arxiv-net:
    driver: bridge