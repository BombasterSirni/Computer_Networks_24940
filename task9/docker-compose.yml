services:
  server:
    image: python:3.12-slim
    container_name: ipv6-test-server
    restart: unless-stopped
    command: ["python3", "-m", "http.server", "8000", "--bind", "::"]
    networks:
      testnet:
        ipv4_address: 172.28.0.10
        ipv6_address: 2001:db8:bbbb::10

  client:
    image: python:3.12-slim
    container_name: ipv6-test-client
    restart: no
    volumes:
      - ./client.py:/app/client.py:ro
    working_dir: /app
    command: python3 client.py
    networks:
      testnet:
        ipv4_address: 172.28.0.20
        ipv6_address: 2001:db8:bbbb::20
    depends_on:
      - server

networks:
  testnet:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.28.0.0/24
        - subnet: 2001:db8:bbbb::/64